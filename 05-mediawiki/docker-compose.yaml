services:
  mediawiki:
    image: mediawiki:1.46
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - mediawiki-images:/var/www/html/images
      # Descomenta esta línea después de correr el instalador web y descargar tu LocalSettings.php
      # - ./LocalSettings.php:/var/www/html/LocalSettings.php
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mediawiki
      MYSQL_USER: mediawiki
      # ⚠️ Solo para demo/local. Nunca hardcodees contraseñas así en producción: usa secrets o variables de entorno externas.
      MYSQL_PASSWORD: mediawiki-pass
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mediawiki-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mediawiki-images:
  mediawiki-db:
