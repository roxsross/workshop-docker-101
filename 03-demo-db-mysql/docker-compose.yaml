services:
  mysql:
    image: mysql:8.4
    container_name: mysql-container
    restart: unless-stopped
    environment:
      # ⚠️ Solo para demo/local. Nunca hardcodees contraseñas así en producción: usa secrets o variables de entorno externas.
      MYSQL_ROOT_PASSWORD: my-data-pass
      MYSQL_DATABASE: base_de_datos
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data/mysql-data.sql:/docker-entrypoint-initdb.d/mysql-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
